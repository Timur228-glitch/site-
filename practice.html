<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Закрепляющие задания</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7e6;
      margin: 0;
      padding: 0;
    }

    nav {
      text-align: center;
      background: #333;
      padding: 10px;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    .container {
      max-width: 960px;
      margin: auto;
      padding: 20px;
      background: white;
      animation: fadeIn 1.5s;
    }

    h1 {
      text-align: center;
      color: #b36b00;
    }

    .task {
      margin-bottom: 20px;
    }

    .task label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .task input,
    .task textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background-color: #b36b00;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #d48806;
    }

    #result {
      margin-top: 30px;
      font-weight: bold;
      color: green;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Главная</a>
    <a href="intro.html">Причины</a>
    <a href="sides.html">Стороны</a>
    <a href="events.html">События</a>
    <a href="results.html">Итоги</a>
    <a href="practice.html">Задания</a>
    <a href="quiz.html">Тест</a>
  </nav>

  <div class="container">
    <h1>Закрепляющие задания</h1>

    <div class="task">
      <label for="task1">Задание 1: Перечислите основные причины Гражданской войны.</label>
      <textarea id="task1" rows="4" placeholder="Введите ваш ответ здесь..."></textarea>
    </div>

    <div class="task">
      <label for="task2">Задание 2: Назовите три основные силы, участвовавшие в конфликте.</label>
      <textarea id="task2" rows="3" placeholder="Введите ваш ответ здесь..."></textarea>
    </div>

    <div class="task">
      <label for="task3">Задание 3: Какие события произошли в 1919 году?</label>
      <textarea id="task3" rows="3" placeholder="Введите ваш ответ здесь..."></textarea>
    </div>

    <button onclick="checkAnswers()">Проверить ответы</button>

    <div id="result"></div>
  </div>

  <script>
    function checkAnswers() {
      const task1 = document.getElementById('task1').value.trim();
      const task2 = document.getElementById('task2').value.trim();
      const task3 = document.getElementById('task3').value.trim();

      if (task1 && task2 && task3) {
        document.getElementById('result').textContent = "Спасибо! Ваши ответы сохранены.";
      } else {
        document.getElementById('result').textContent = "Пожалуйста, заполните все поля.";
      }
    }
  </script>

</body>
</html>
